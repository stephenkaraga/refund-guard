[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "merchant-ops-agent"
version = "0.1.0"
description = "A policy-following merchant operations agent, measured for reliability on tau2-bench."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    # Pinned to a release tag so results are reproducible.
    "tau2 @ git+https://github.com/sierra-research/tau2-bench@v1.0.1",
    "langgraph>=0.2",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
agentcore = ["bedrock-agentcore"]

[project.scripts]
merchant-ops = "merchant_ops.cli:app"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/merchant_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# typer declares CLI options as call defaults by design.
"src/merchant_ops/cli.py" = ["B008"]
